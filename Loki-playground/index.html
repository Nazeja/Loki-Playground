<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loki Playground</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8fafc; color: #1f2937; }
    main { max-width: 860px; margin: 0 auto; padding: 48px 20px; }
    h1 { margin: 0 0 10px; font-size: clamp(32px, 6vw, 54px); }
    p { color: #667085; line-height: 1.8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 28px; }
    a.card { display: block; padding: 20px; border: 1px solid #e5e7eb; border-radius: 20px; background: white; color: inherit; text-decoration: none; box-shadow: 0 10px 26px rgba(15,23,42,.06); }
    .card h2 { margin: 0 0 8px; }
    .card p { margin: 0; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Loki Playground</h1>
    <p>一些轻量、单文件、好玩的前端小工具集合。</p>
    <section class="grid">
      <a class="card" href="./bubble-palette/">
        <h2>气泡调色台</h2>
        <p>预览图片背景、半透明聊天气泡、诗歌文字、引用、code 和链接的配色效果。</p>
      </a>
      <a class="card" href="./quote-book/">
        <h2>摘录书</h2>
        <p>纸质手帐风的私人摘录管理器，支持角色头像、粘贴解析、阅读页档案展示和本地备份。</p>
      </a>
    </section>
  </main>
</body>
</html>
